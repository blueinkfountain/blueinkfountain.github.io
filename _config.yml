title: "Blueink"
description: "Blog"
remote_theme: just-the-docs/just-the-docs

# 기본적인 URL 설정
url: "https://blueinkfountain.github.io"

# 플러그인 설정
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# 수학 수식 사용 설정
kramdown:
  math_engine: mathjax

# 사이드바 설정 (자동 생성)
nav_enabled: true
footer_content: "Copyright © 2026 Blueink"
# nav_expand: true


aux_links:
  "GitHub": https://github.com/blueinkfountain/blueinkfountain.github.io

# 구글 애널리틱스 설정 (Just the Docs 공식 지원 방식)
ga_tracking: G-TWJE3MTBZ7
ga_tracking_anonymize_ip: true # 개인정보 보호를 위해 IP 익명화 활성화 (권장)

# SEO 플러그인용 설정 (함께 적어주면 더 정확합니다)
google_analytics: G-TWJE3MTBZ7

# Keep local Euler source packages out of GitHub Pages navigation.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - euler_method_web
  - euler_method_pixel_web
  - euler_method_latex_web
  - euler_latex_upgrade
  - ode_lab_rk4_web
  - ode_lab_second_order_web
  - ode_lab_timeline_fix
  - scripts
  - tests
  - tools
  - maintenance
  - README.md
  - requirements.txt
  - requirements-gui.txt
  - package.json
  - update-notes.sh
  - untexed
  - daily_record_note
  - .archive
  - .venv
  - .cache
  - .superpowers
  - ode_lab_dynamics_upgrade
