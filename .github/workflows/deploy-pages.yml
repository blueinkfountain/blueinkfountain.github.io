name: Build and Deploy Math Blog

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  # ======================================================
  # Build
  # ======================================================

  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Repository 가져오기
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------
      # 2. GitHub Pages 설정
      # --------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # --------------------------------------------------
      # 3. Jekyll build
      #
      # Record와 ink 계산은 이미 로컬 pre-commit에서 완료됨.
      #
      # GitHub에는:
      #   _data/untexed_records.yml
      #   untexed-current/
      #
      # 만 올라와 있고, 이것들을 사용해 사이트를 빌드함.
      # --------------------------------------------------

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

        with:
          source: ./
          destination: ./_site


      # --------------------------------------------------
      # 4. 완성된 사이트 업로드
      # --------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

        with:
          path: ./_site



  # ======================================================
  # Deploy
  # ======================================================

  deploy:

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest

    needs: build


    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4