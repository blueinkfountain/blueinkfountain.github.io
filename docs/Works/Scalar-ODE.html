---
layout: default
title: Scalar ODE
parent: ODE Lab
grand_parent: Math Programs
nav_order: 1
lab_mode: scalar
---
<link rel="stylesheet" href="{{ '/assets/euler-method/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/euler-method/dynamics.css' | relative_url }}">
<div class="em-app" id="euler-lab" data-mode="scalar">
  <header class="em-header">
    <h1>Scalar ODE</h1>
    {% include ode-lab/navigation.html %}
  </header>
  <div class="em-layout" id="em-scalar-layout">
    <aside class="em-side" aria-label="Graph controls">
      <section class="em-side-section">
        <div class="em-section-title"><h2>ODE</h2></div>
        <div class="em-order-switch" role="group" aria-label="Differential equation order">
          <button type="button" class="em-order-button is-selected" id="em-order-first" aria-pressed="true">1st order</button>
          <button type="button" class="em-order-button" id="em-order-second" aria-pressed="false">2nd order</button>
        </div>
        <label class="em-field" for="em-equation">Example</label>
        <select class="em-select" id="em-equation" aria-label="ODE example"></select>
        <label class="em-field" for="em-equation-latex" id="em-equation-label">LaTeX · y′ = f(x, y)</label>
        <textarea class="em-input em-latex" id="em-equation-latex" rows="1" spellcheck="false" placeholder="e.g. y(1-y)" aria-label="Differential equation in LaTeX"></textarea>
        <p class="em-input-error" id="em-equation-error" role="alert" hidden></p>
        <div class="em-solver-row">
          <label class="em-field" for="em-method">Method</label>
          <select class="em-select" id="em-method" aria-label="Numerical method">
            <option value="rk4" selected>Runge–Kutta 4</option>
            <option value="euler">Euler</option>
          </select>
        </div>
        <div class="em-input-pair em-initial-values">
          <label class="em-field" for="em-x0">x₀ <input class="em-input" id="em-x0" type="number" step="any" value="0"></label>
          <label class="em-field" for="em-y0">y(x₀) <input class="em-input" id="em-y0" type="number" step="any" value="0.5"></label>
          <label class="em-field" for="em-v0" id="em-v0-row" hidden>y′(x₀) <input class="em-input" id="em-v0" type="number" step="any" value="0"></label>
        </div>
        <label class="em-field" for="em-plot-mode" id="em-plot-mode-row" hidden>Plot
          <select class="em-select" id="em-plot-mode">
            <option value="solution">y(x) · solution</option>
            <option value="phase">(y, y′) · phase plane</option>
          </select>
        </label>
        <label class="em-field" for="em-step">Step size · h</label>
        <div class="em-step-row">
          <button class="em-mini-button" id="em-step-down" type="button" aria-label="Decrease step size">−</button>
          <input class="em-input" id="em-step" type="number" min="0.001" max="2" step="any" value="0.1">
          <button class="em-mini-button" id="em-step-up" type="button" aria-label="Increase step size">+</button>
        </div>
        <input type="range" id="em-step-range" class="em-step-range" min="0" max="1000" step="1" value="606" aria-label="Drag to adjust integration step size">
      </section>

      <section class="em-side-section">
        <div class="em-section-title"><h2>Parametric curve</h2></div>
        <label class="em-field" for="em-param-x">x(t)</label>
        <textarea class="em-input em-latex" id="em-param-x" rows="1" spellcheck="false" placeholder="e.g. 2\cos(t)" aria-label="Parametric x(t) in LaTeX"></textarea>
        <label class="em-field" for="em-param-y">y(t)</label>
        <textarea class="em-input em-latex" id="em-param-y" rows="1" spellcheck="false" placeholder="e.g. \sin(3t)" aria-label="Parametric y(t) in LaTeX"></textarea>
        <p class="em-input-error" id="em-param-error" role="alert" hidden></p>
      </section>

      <section class="em-side-section em-compact-section">
        <details class="em-settings" open>
          <summary>Layers &amp; view</summary>
          <div class="em-toggle-list">
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch field"></i>Direction field</span><input id="em-show-field" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch red"></i>Solution</span><input id="em-show-solution" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch blue"></i><span id="em-compare-label">Euler comparison</span></span><input id="em-show-compare" type="checkbox"></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch green"></i>Parametric curve</span><input id="em-show-parameter" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch amber"></i>Tracer</span><input id="em-trace" type="checkbox"></label>
          </div>
          <label class="em-field" for="em-render-style">Style</label>
          <select class="em-select" id="em-render-style" aria-label="Rendering style">
            <option value="pixel" selected>Pixel · 1px</option>
            <option value="smooth">Smooth · 1pt</option>
          </select>
          <div class="em-reset-row">
            <button class="em-btn" id="em-reset-view" type="button">Reset view</button>
            <button class="em-btn" id="em-reset-all" type="button">Clear all</button>
          </div>
        </details>
      </section>
    </aside>

    <section class="em-plot-panel" aria-label="Interactive graph">
      <div class="em-panel-top">
        <h2>Graph</h2>
        <span class="em-live" id="em-live">Ready</span>
      </div>
      <div class="em-canvas-wrap" id="em-canvas-wrap">
        <canvas class="em-canvas" id="em-canvas" tabindex="0" aria-label="Coordinate plane: drag to pan, drag the step handle to change h, double-click to set initial condition, scroll to zoom"></canvas>
        <div class="em-overlay" aria-hidden="true"><span class="em-overlay-chip" id="em-equation-overlay" hidden></span><span class="em-overlay-chip" id="em-zoom">60 px/unit</span></div>
        <div class="em-tooltip" id="em-cursor">x: 0 · y: 0</div>
      </div>
      <div class="em-playbar">
        <div class="em-playtop">
          <button type="button" class="em-btn em-primary" id="em-play" disabled>▶ Play</button>
          <button type="button" class="em-btn" id="em-rewind">↺</button>
          <span class="em-time-number" id="em-time-value">0.000</span>
          <span class="em-play-spacer"></span>
          <select class="em-select em-speed-select" id="em-speed" aria-label="Animation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
        <input class="em-timeline" type="range" id="em-time" min="0" max="10000" step="0.001" value="0" disabled aria-label="Simulation time, drag to scrub numerical solution or parametric curve">
        <div class="em-statline"><span id="em-stat-steps">—</span><span id="em-stat-endpoint">—</span><span id="em-stat-difference" hidden>—</span></div>
        <p class="em-message" id="em-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </div>

</div>
<script type="module" src="{{ '/assets/euler-method/app.mjs' | relative_url }}?v=time-10000"></script>
