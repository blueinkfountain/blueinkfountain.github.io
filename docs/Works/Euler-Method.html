---
layout: default
title: ODE Lab
parent: Math Programs
nav_order: 1
---
<link rel="stylesheet" href="{{ '/assets/euler-method/style.css' | relative_url }}">
<div class="em-app" id="euler-lab">
  <header class="em-header">
    <h1>ODE Lab</h1>
    <nav class="dl-mode-tabs" aria-label="Mathematical model">
      <button class="dl-tab is-selected" type="button" id="dl-tab-scalar" aria-pressed="true">Scalar ODE</button>
      <button class="dl-tab" type="button" id="dl-tab-system" aria-pressed="false">ODE Systems</button>
      <button class="dl-tab" type="button" id="dl-tab-cucker" aria-pressed="false">Cucker–Smale</button>
    </nav>
  </header>

  <div class="em-layout" id="em-scalar-layout">
    <aside class="em-side" aria-label="Graph controls">
      <section class="em-side-section">
        <div class="em-section-title"><h2>ODE</h2></div>
        <div class="em-order-switch" role="group" aria-label="Differential equation order">
          <button type="button" class="em-order-button is-selected" id="em-order-first" aria-pressed="true">1st order</button>
          <button type="button" class="em-order-button" id="em-order-second" aria-pressed="false">2nd order</button>
        </div>
        <label class="em-field" for="em-equation">Example</label>
        <select class="em-select" id="em-equation" aria-label="ODE example"></select>
        <label class="em-field" for="em-equation-latex" id="em-equation-label">LaTeX · y′ = f(x, y)</label>
        <textarea class="em-input em-latex" id="em-equation-latex" rows="1" spellcheck="false" placeholder="e.g. y(1-y)" aria-label="Differential equation in LaTeX"></textarea>
        <p class="em-input-error" id="em-equation-error" role="alert" hidden></p>
        <div class="em-solver-row">
          <label class="em-field" for="em-method">Method</label>
          <select class="em-select" id="em-method" aria-label="Numerical method">
            <option value="rk4" selected>Runge–Kutta 4</option>
            <option value="euler">Euler</option>
          </select>
        </div>
        <div class="em-input-pair em-initial-values">
          <label class="em-field" for="em-x0">x₀ <input class="em-input" id="em-x0" type="number" step="any" value="0"></label>
          <label class="em-field" for="em-y0">y(x₀) <input class="em-input" id="em-y0" type="number" step="any" value="0.5"></label>
          <label class="em-field" for="em-v0" id="em-v0-row" hidden>y′(x₀) <input class="em-input" id="em-v0" type="number" step="any" value="0"></label>
        </div>
        <label class="em-field" for="em-plot-mode" id="em-plot-mode-row" hidden>Plot
          <select class="em-select" id="em-plot-mode">
            <option value="solution">y(x) · solution</option>
            <option value="phase">(y, y′) · phase plane</option>
          </select>
        </label>
        <label class="em-field" for="em-step">Step size · h</label>
        <div class="em-step-row">
          <button class="em-mini-button" id="em-step-down" type="button" aria-label="Decrease step size">−</button>
          <input class="em-input" id="em-step" type="number" min="0.001" max="2" step="any" value="0.1">
          <button class="em-mini-button" id="em-step-up" type="button" aria-label="Increase step size">+</button>
        </div>
        <input type="range" id="em-step-range" class="em-step-range" min="0" max="1000" step="1" value="606" aria-label="Drag to adjust integration step size">
      </section>

      <section class="em-side-section">
        <div class="em-section-title"><h2>Parametric curve</h2></div>
        <label class="em-field" for="em-param-x">x(t)</label>
        <textarea class="em-input em-latex" id="em-param-x" rows="1" spellcheck="false" placeholder="e.g. 2\cos(t)" aria-label="Parametric x(t) in LaTeX"></textarea>
        <label class="em-field" for="em-param-y">y(t)</label>
        <textarea class="em-input em-latex" id="em-param-y" rows="1" spellcheck="false" placeholder="e.g. \sin(3t)" aria-label="Parametric y(t) in LaTeX"></textarea>
        <p class="em-input-error" id="em-param-error" role="alert" hidden></p>
      </section>

      <section class="em-side-section em-compact-section">
        <details class="em-settings" open>
          <summary>Layers &amp; view</summary>
          <div class="em-toggle-list">
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch field"></i>Direction field</span><input id="em-show-field" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch red"></i>Solution</span><input id="em-show-solution" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch blue"></i><span id="em-compare-label">Euler comparison</span></span><input id="em-show-compare" type="checkbox"></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch green"></i>Parametric curve</span><input id="em-show-parameter" type="checkbox" checked></label>
            <label class="em-toggle"><span class="em-switchline"><i class="em-swatch amber"></i>Tracer</span><input id="em-trace" type="checkbox"></label>
          </div>
          <label class="em-field" for="em-render-style">Style</label>
          <select class="em-select" id="em-render-style" aria-label="Rendering style">
            <option value="pixel" selected>Pixel · 1px</option>
            <option value="smooth">Smooth · 1pt</option>
          </select>
          <div class="em-reset-row">
            <button class="em-btn" id="em-reset-view" type="button">Reset view</button>
            <button class="em-btn" id="em-reset-all" type="button">Clear all</button>
          </div>
        </details>
      </section>
    </aside>

    <section class="em-plot-panel" aria-label="Interactive graph">
      <div class="em-panel-top">
        <h2>Graph</h2>
        <span class="em-live" id="em-live">Ready</span>
      </div>
      <div class="em-canvas-wrap" id="em-canvas-wrap">
        <canvas class="em-canvas" id="em-canvas" tabindex="0" aria-label="Coordinate plane: drag to pan, drag the step handle to change h, double-click to set initial condition, scroll to zoom"></canvas>
        <div class="em-overlay" aria-hidden="true"><span class="em-overlay-chip" id="em-equation-overlay" hidden></span><span class="em-overlay-chip" id="em-zoom">60 px/unit</span></div>
        <div class="em-tooltip" id="em-cursor">x: 0 · y: 0</div>
      </div>
      <div class="em-playbar">
        <div class="em-playtop">
          <button type="button" class="em-btn em-primary" id="em-play" disabled>▶ Play</button>
          <button type="button" class="em-btn" id="em-rewind">↺</button>
          <span class="em-time-number" id="em-time-value">0.000</span>
          <span class="em-play-spacer"></span>
          <select class="em-select em-speed-select" id="em-speed" aria-label="Animation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
        <input class="em-timeline" type="range" id="em-time" min="0" max="100" step="0.001" value="0" disabled aria-label="Simulation time, drag to scrub numerical solution or parametric curve">
        <div class="em-statline"><span id="em-stat-steps">—</span><span id="em-stat-endpoint">—</span><span id="em-stat-difference" hidden>—</span></div>
        <p class="em-message" id="em-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </div>

  <div class="dl-layout" id="dl-layout" hidden>
    <aside class="dl-side" aria-label="Dynamical system parameters">
      <div id="dl-system-controls">
        <div class="dl-section"><div class="dl-heading">System <select id="dl-dim" aria-label="Dimension"><option value="2">2D</option><option value="3">3D</option></select></div>
          <select id="dl-preset" class="dl-input" aria-label="Example system"><option value="">Custom (blank)</option><option value="oscillator">Harmonic oscillator</option><option value="vdp">Van der Pol</option><option value="predator">Lotka–Volterra</option><option value="lorenz">Lorenz attractor</option><option value="rossler">Rössler attractor</option></select>
          <label class="dl-label" for="dl-dx">x′ =</label><textarea id="dl-dx" class="dl-input dl-formula" rows="1" placeholder="LaTeX · e.g. y" spellcheck="false"></textarea>
          <label class="dl-label" for="dl-dy">y′ =</label><textarea id="dl-dy" class="dl-input dl-formula" rows="1" placeholder="LaTeX · e.g. -x" spellcheck="false"></textarea>
          <div id="dl-z-wrap" hidden><label class="dl-label" for="dl-dz">z′ =</label><textarea id="dl-dz" class="dl-input dl-formula" rows="1" placeholder="LaTeX · e.g. x*y" spellcheck="false"></textarea></div>
          <p class="dl-error" id="dl-system-error" role="alert" hidden></p>
          <label class="dl-label" for="dl-initial">Initial conditions · one per row</label><textarea id="dl-initial" class="dl-input dl-multi" rows="2" spellcheck="false" placeholder="1, 0&#10;0, 1"></textarea>
        </div>
        <div class="dl-section"><div class="dl-heading">Integration</div>
          <div class="dl-pair"><label>Method<select id="dl-method" class="dl-input"><option value="rk4">RK4</option><option value="euler">Euler</option></select></label><label>Step h<input id="dl-step" class="dl-input" type="number" min="0.001" max="1" value="0.02" step="any"></label></div>
          <input id="dl-step-range" class="dl-range" type="range" min="0" max="1000" value="460" aria-label="Integration step size">
          <div class="dl-pair"><label>Time span<input id="dl-tmax" class="dl-input" type="number" min="0.1" max="100" value="20" step="any"></label><label>Graph<select id="dl-plot" class="dl-input"><option value="phase">Phase space</option><option value="series">Time series</option></select></label></div>
          <label class="dl-check"><input id="dl-field" type="checkbox" checked> Vector field (2D)</label>
          <button class="dl-button" type="button" id="dl-clear-system">Clear</button>
        </div>
      </div>
      <div id="dl-cucker-controls" hidden>
        <div class="dl-section"><div class="dl-heading">Cucker–Smale</div>
          <div class="dl-pair"><label>Particles N<input class="dl-input" type="number" id="dl-n" min="2" max="250" step="1" value="80"></label><label>Coupling λ<input class="dl-input" type="number" id="dl-lambda" min="0" max="100" step="any" value="4"></label></div>
          <label>Communication kernel<select class="dl-input" id="dl-kernel"><option value="algebraic">1 / (1 + r²)^β</option><option value="original">Original C++ ψ(r)</option></select></label>
          <div class="dl-pair"><label>β<input class="dl-input" type="number" id="dl-beta" min="0" max="5" step=".1" value="0.5"></label><label>Seed<input class="dl-input" type="number" id="dl-seed" step="1" value="23"></label></div>
          <div class="dl-pair"><label>Position spread<input class="dl-input" type="number" id="dl-spread" min="0" max="50" step="any" value="5"></label><label>Velocity spread<input class="dl-input" type="number" id="dl-vspread" min="0" max="100" step="any" value="3"></label></div>
          <label>Graph<select class="dl-input" id="dl-c-plot"><option value="agents">Particles · 3D</option><option value="alignment">Velocity alignment · σ(t)</option></select></label>
          <div class="dl-pair"><label>Method<select class="dl-input" id="dl-cmethod"><option value="rk4">RK4</option><option value="euler">Euler</option></select></label><label>Step h<input class="dl-input" id="dl-cstep" type="number" min="0.001" max="0.1" step="any" value="0.02"></label></div>
          <label class="dl-check"><input type="checkbox" id="dl-trails" checked> Particle trails</label>
          <div class="dl-pair"><button class="dl-button" type="button" id="dl-c-reset">Reset agents</button><button class="dl-button" type="button" id="dl-c-original">C++ parameters</button></div>
        </div>
        <div class="dl-section"><div class="dl-heading">Velocity alignment</div><div class="dl-metrics" id="dl-metrics">—</div></div>
      </div>
    </aside>
    <section class="dl-plot-panel" aria-label="Dynamical system visualisation">
      <div class="dl-panel-top"><strong id="dl-graph-label">Phase space</strong><div class="dl-panel-actions"><button id="dl-fit" class="dl-button" type="button">Fit view</button><button id="dl-export" class="dl-button" type="button">Export CSV</button><span id="dl-status">Ready</span></div></div>
      <div class="dl-canvas-wrap"><canvas id="dl-canvas" tabindex="0" aria-label="Drag to pan (2D) or rotate (3D). Scroll to zoom."></canvas><div id="dl-coordinates"></div></div>
      <div class="dl-playbar">
        <div class="dl-controls"><button class="dl-button dl-primary" id="dl-play" type="button">▶ Play</button><button class="dl-button" id="dl-reset-time" type="button">↺</button><output id="dl-time-value">t = 0.000</output><select id="dl-speed" class="dl-input" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
        <input id="dl-time" class="dl-range" type="range" min="0" max="20" value="0" step="0.001" aria-label="Drag to seek simulation time">
        <div id="dl-result" class="dl-result" role="status"></div>
      </div>
    </section>
  </div>
</div>
<script type="module" src="{{ '/assets/euler-method/app.mjs' | relative_url }}?v=dynamics-1"></script>

<link rel="stylesheet" href="{{ '/assets/euler-method/dynamics.css' | relative_url }}">
